name: Check extension
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm test
      - run: npm run package
      - name: Verify archives
        run: |
          python3 - <<'PY'
          import glob,json,zipfile
          version=json.load(open('package.json'))['version']
          for browser in ('chrome','firefox'):
              with zipfile.ZipFile(f'releases/pecta-mode-{version}-{browser}.zip') as archive:
                  assert archive.testzip() is None
                  assert json.loads(archive.read(f'{browser}/manifest.json'))['version']==version
          PY
